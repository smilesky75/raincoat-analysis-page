<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merry Christmas NT 聖誕交換禮物日</title>
<style>
:root{
  --bg:#FBF8F3;
  --surface:#FFFFFF;
  --ink:#26211C;
  --ink-soft:#6B6259;
  --pine:#1F4B3F;
  --pine-dark:#16352C;
  --berry:#A23B3B;
  --gold:#C79A45;
  --border:#E4DCCB;
  --danger:#B3402F;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12201B;
    --surface:#1B2A23;
    --ink:#F3EFE6;
    --ink-soft:#B9AF9E;
    --pine:#5FA085;
    --pine-dark:#3E7460;
    --berry:#E08A8A;
    --gold:#E4C079;
    --border:#33443B;
    --danger:#E08A8A;
  }
}
:root[data-theme="dark"]{
  --bg:#12201B;
  --surface:#1B2A23;
  --ink:#F3EFE6;
  --ink-soft:#B9AF9E;
  --pine:#5FA085;
  --pine-dark:#3E7460;
  --berry:#E08A8A;
  --gold:#E4C079;
  --border:#33443B;
  --danger:#E08A8A;
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  padding-inline:16px;
  padding-block:32px;
  display:flex;
  justify-content:center;
  line-break:strict;
  text-wrap:pretty;
}

.page{
  width:100%;
  max-width:480px;
  display:flex;
  flex-direction:column;
  gap:20px;
}

.header{
  background:var(--pine);
  color:#FBF8F3;
  border-radius:16px;
  padding:28px 24px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  text-align:center;
  position:relative;
  overflow:hidden;
}
.header svg.icon-gift{
  width:36px;
  height:36px;
  color:var(--gold);
}
.header h1{
  margin:0;
  font-size:21px;
  font-weight:700;
  letter-spacing:0.02em;
  text-wrap:balance;
}
.header p{
  margin:0;
  font-size:13px;
  color:#D8E4DD;
}
.snow{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:0.35;
}

.info-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px 22px;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.info-row{
  display:flex;
  align-items:flex-start;
  gap:10px;
  font-size:14px;
  color:var(--ink);
}
.info-row svg{
  width:18px;
  height:18px;
  color:var(--berry);
  flex-shrink:0;
  margin-top:1px;
}
.info-row .info-body{
  display:flex;
  flex-direction:column;
  gap:2px;
}
.info-row .info-label{
  font-size:12px;
  color:var(--ink-soft);
}
.info-row .info-value{
  font-weight:700;
}
.info-row .info-sub{
  font-size:13px;
  color:var(--ink-soft);
  font-weight:400;
}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px 22px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.card h2{
  margin:0;
  font-size:15px;
  display:flex;
  align-items:center;
  gap:8px;
}
.card h2 svg{
  width:18px;
  height:18px;
  color:var(--berry);
  flex-shrink:0;
}
.card p{
  margin:0;
  font-size:13px;
  color:var(--ink-soft);
  line-height:1.7;
}
.card ul{
  margin:0;
  padding-left:0;
  list-style:none;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.card ul li{
  font-size:13px;
  color:var(--ink-soft);
  line-height:1.6;
  display:flex;
  gap:8px;
  align-items:flex-start;
}
.card ul li svg{
  width:14px;
  height:14px;
  color:var(--gold);
  flex-shrink:0;
  margin-top:3px;
}
.card .highlight{
  color:var(--berry);
  font-weight:700;
}

.deadline{
  background:var(--surface);
  border:1px solid var(--danger);
  border-radius:16px;
  padding:16px 22px;
  display:flex;
  align-items:center;
  gap:10px;
}
.deadline svg{
  width:20px;
  height:20px;
  color:var(--danger);
  flex-shrink:0;
}
.deadline p{
  margin:0;
  font-size:13px;
  color:var(--danger);
  font-weight:700;
  line-height:1.6;
}

.cta{
  display:flex;
  flex-direction:column;
  gap:10px;
}
a.submit{
  font:inherit;
  font-size:15px;
  font-weight:700;
  color:#FBF8F3;
  background:var(--pine);
  border:none;
  border-radius:10px;
  padding:14px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  text-decoration:none;
}
a.submit:hover{background:var(--pine-dark);}
a.submit svg{width:18px;height:18px;flex-shrink:0;}
.hint{
  font-size:12px;
  color:var(--ink-soft);
  text-align:center;
  margin:0;
}
</style>
</head>
<body>

<div class="page">
  <div class="header">
    <svg class="snow" viewBox="0 0 480 140" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g stroke="#FBF8F3" stroke-width="1.5" stroke-linecap="round">
        <path d="M40 20 L40 34 M33 27 L47 27 M35 22 L45 32 M45 22 L35 32"/>
        <path d="M420 30 L420 44 M413 37 L427 37 M415 32 L425 42 M425 32 L415 42"/>
        <path d="M200 12 L200 22 M195 17 L205 17"/>
        <path d="M320 90 L320 100 M315 95 L325 95"/>
        <path d="M90 100 L90 112 M84 106 L96 106 M86 102 L94 110 M94 102 L86 110"/>
      </g>
    </svg>
    <svg class="icon-gift" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="9" width="18" height="11" rx="1.5"/>
      <path d="M3 9v11M12 9v11"/>
      <path d="M12 9H7.5a2.5 2.5 0 1 1 2-4c1.4 0 2.5 2 2.5 4Z"/>
      <path d="M12 9h4.5a2.5 2.5 0 1 0-2-4c-1.4 0-2.5 2-2.5 4Z"/>
      <path d="M2 9h20v3H2z"/>
    </svg>
    <h1>Merry Christmas NT<br>聖誕交換禮物日</h1>
    <p>一起吃飯、聊天、抽禮物，過個熱鬧的聖誕</p>
  </div>

  <div class="info-card">
    <div class="info-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <div class="info-body">
        <span class="info-label">日期</span>
        <span class="info-value">12/19（六）</span>
      </div>
    </div>
    <div class="info-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      <div class="info-body">
        <span class="info-label">活動時間</span>
        <span class="info-value">11:00 ～ 13:00</span>
      </div>
    </div>
    <div class="info-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12Z"/><circle cx="12" cy="9" r="2.5"/></svg>
      <div class="info-body">
        <span class="info-label">地點</span>
        <span class="info-value">這隻雞全席美食</span>
        <span class="info-sub">台中市烏日區三和里中山路三段164號</span>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="11" rx="1.5"/><path d="M3 9v11M12 9v11"/><path d="M12 9H7.5a2.5 2.5 0 1 1 2-4c1.4 0 2.5 2 2.5 4Z"/><path d="M12 9h4.5a2.5 2.5 0 1 0-2-4c-1.4 0-2.5 2-2.5 4Z"/><path d="M2 9h20v3H2z"/></svg>
      交換禮物規則
    </h2>
    <p>3 小時的聚會除了吃飯，還安排了交換禮物環節。</p>
    <ul>
      <li>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>
        <span>準備一份 <span class="highlight">300 元以上</span> 的禮物</span>
      </li>
      <li>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>
        <span>禮物請用包裝袋或箱子包裝完畢</span>
      </li>
      <li>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></svg>
        <span>禮物上請<span class="highlight">勿標示名字</span></span>
      </li>
    </ul>
  </div>

  <div class="card">
    <h2>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/></svg>
      參加費用
    </h2>
    <p>費用請至報名表單查閱。</p>
  </div>

  <div class="deadline">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>
    <p>報名只到 10/31 23:59 止</p>
  </div>

  <div class="cta">
    <a class="submit" href="http://forms.gle/82hN65V3T9ZJAy1z9" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      前往報名表單
    </a>
    <p class="hint">點擊按鈕開啟 Google 表單完成報名與繳費</p>
  </div>
</div>

</body>
</html>
